<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M9 4h14l-2 13a5 5 0 0 1-10 0z%22 fill=%22%23E8B42C%22/%3E%3Cpath d=%22M16 22v6M11 28h10%22 stroke=%22%23333%22 stroke-width=%222%22/%3E%3C/svg%3E">
<script src="config.js"></script>
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}</style>
<title>Bin to Bottle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: taproom operations board. Bright, airy work surface like a craft beverage label: condensed uppercase headlines,
   pill controls, one fresh teal accent with hop-gold highlights. Left rail of stations in the order fruit moves;
   on phones the rail becomes a sticky, horizontally scrolling station strip. */
:root{
  --bg:#F5F7F4; --surface:#FFFFFF; --surface-2:#ECF0EC; --ink:#17201E; --muted:#56625F; --line:#DCE3DF;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#DDF1EF; --brass:#8F5F00; --gold:#F2B634;
  --ok:#22804A; --ok-soft:#DDF0E3; --warn:#9A5A00; --warn-soft:#FBEBCD; --bad:#B42318; --bad-soft:#FBE1DE;
  --cider-white:#E8B42C; --cider-red:#B9621B; --cider-rose:#EC8790; --cider-clear:#BFE3D6; --foam:#FFF8E4; --glass-line:#86928E; --paper:#FFFFFF;
  --on-white-cider:#2A2005; --on-red-cider:#24140A; --on-rose-cider:#3A0F1A;
  --shadow:0 1px 2px rgba(23,32,30,.05),0 6px 18px -12px rgba(23,32,30,.18);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#172020; --surface-2:#1F2A29; --ink:#E9F0EE; --muted:#98A6A3; --line:#2A3735;
  --accent:#3FC7BC; --accent-ink:#04201E; --accent-soft:#103A37; --brass:#F2BE4A; --gold:#F2BE4A;
  --ok:#5CCB8B; --ok-soft:#14321F; --warn:#F0AE4A; --warn-soft:#382A10; --bad:#F4847A; --bad-soft:#3D1C1A;
  --cider-white:#F0C64A; --cider-red:#D57E35; --cider-rose:#F29BA2; --cider-clear:#8FCBB8; --foam:#F4E9C9; --glass-line:#8C9A96; --paper:#172020;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#172020; --surface-2:#1F2A29; --ink:#E9F0EE; --muted:#98A6A3; --line:#2A3735;
  --accent:#3FC7BC; --accent-ink:#04201E; --accent-soft:#103A37; --brass:#F2BE4A; --gold:#F2BE4A;
  --ok:#5CCB8B; --ok-soft:#14321F; --warn:#F0AE4A; --warn-soft:#382A10; --bad:#F4847A; --bad-soft:#3D1C1A;
  --cider-white:#F0C64A; --cider-red:#D57E35; --cider-rose:#F29BA2; --cider-clear:#8FCBB8; --foam:#F4E9C9; --glass-line:#8C9A96; --paper:#172020;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-stretch:82%;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:2.3rem;font-weight:900;line-height:1;font-stretch:68%;text-transform:uppercase;letter-spacing:.005em}
h2{font-size:1.2rem;font-weight:800;font-stretch:78%}
h3{font-size:1rem;font-weight:680}
p{margin:0}
a{color:var(--accent)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-display);font-stretch:66%;font-weight:900;font-size:1.45rem;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-size:.72rem;color:var(--muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:999px;color:var(--muted);font-weight:600}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.nav button[aria-current="page"] .step{opacity:.9}
.nav .step{font-family:var(--f-mono);font-size:.7rem;width:18px;text-align:right;opacity:.75}
.nav button:focus-visible{outline:2px solid var(--accent)}
.rail-foot{margin-top:auto;font-size:.78rem;color:var(--muted);display:grid;gap:6px}
.sample{display:inline-block;justify-self:start;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#2A1F00;background:var(--gold);border-radius:999px;padding:2px 9px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2);justify-self:start}
.seg button{all:unset;cursor:pointer;font-size:.8rem;font-weight:600;padding:5px 12px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:2px solid var(--accent)}
main{min-width:0;padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1180px;margin:0 auto;display:grid;gap:26px}
@media (min-width:901px){main{padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}}
@media (max-width:900px){
  h1{font-size:1.9rem}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:6;border-right:0;border-bottom:1px solid var(--line);
    padding-block:10px 0;padding-right:max(16px,env(safe-area-inset-right,0px));gap:8px;overflow:visible}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:8px;scrollbar-width:none;margin-left:-4px}
  .nav button{white-space:nowrap;padding:8px 10px}
  .nav .step{display:none}
  .rail-foot{display:none}
  main{padding-block:18px 60px}
}

/* page head */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head .t{display:grid;gap:6px;min-width:0}
.crumb{all:unset;cursor:pointer;color:var(--muted);font-size:.85rem}
.crumb:hover{color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
section{display:grid;gap:12px;min-width:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* controls */
.btn{appearance:none;font:inherit;font-weight:600;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:8px 16px;min-height:38px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.82rem}
.btn:disabled,.tag:disabled,.tl-bar:disabled{opacity:.42;cursor:not-allowed;filter:none}
.who{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;min-width:0}
.who:hover{background:var(--surface-2)}
.who:focus-visible{outline:2px solid var(--accent)}
.who span:last-child{display:grid;line-height:1.2;min-width:0;font-size:.82rem}
.who small{color:var(--muted);font-size:.72rem}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font:600 .7rem var(--f-body);color:var(--accent-ink);flex:none;letter-spacing:.02em}
.av.sm{width:22px;height:22px;font-size:.62rem}
.brand-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand-row .who.mob{display:none}
@media (max-width:900px){.brand-row .who.mob{display:flex}.brand-row .who.mob span:last-child{display:none}}
.perm{min-width:0}
.perm td,.perm th{text-align:center}
.perm td:first-child,.perm th:first-child{text-align:left}
.perm select{min-height:32px;padding:4px 6px;font-size:.82rem;width:auto;min-width:92px}
.lvl{display:inline-block;min-width:60px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px}
.lvl.edit{background:var(--ok-soft);color:var(--ok)}.lvl.own{background:var(--accent-soft);color:var(--accent)}.lvl.view{background:var(--surface-2);color:var(--muted)}.lvl.none{color:var(--muted);opacity:.7}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.filters button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (pointer:coarse){.btn{min-height:46px;padding:10px 16px}.btn.sm{min-height:38px}}
.icon-btn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;font-size:1.3rem;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
@media (pointer:coarse){input,select{min-height:48px;font-size:16px}}
textarea{min-height:80px;resize:vertical}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:.8rem;font-weight:600;color:var(--muted)}
.field small{color:var(--muted);font-size:.78rem}
.field.check{grid-template-columns:auto 1fr;align-items:center;gap:10px}
.field.check input{width:20px;min-height:20px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fields .full{grid-column:1/-1}
@media (max-width:520px){.fields{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);border-bottom-width:3px}
.tabs button:focus-visible{outline:2px solid var(--accent)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow)}
.panel>.ph{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel>.pb{padding:16px}
.empty{padding:22px 16px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.scroll{overflow-x:auto;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
.t th{text-align:left;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right}
.t td.num{white-space:nowrap}
.t tr.link{cursor:pointer}
.t tr.link:hover td{background:var(--surface-2)}
.t tfoot td{font-weight:600;border-top:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 18px}
.kv div{display:grid;gap:2px;min-width:0}
.kv b{font-weight:600;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.stats b{font-family:var(--f-display);font-stretch:70%;font-size:1.7rem;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}

/* glass */
.glass{display:block;overflow:visible}
.glass .liquid{transform-box:fill-box}
.glass.pour .liquid{animation:pour 1.1s cubic-bezier(.3,.7,.3,1) both}
@keyframes pour{from{transform:translateY(100%)}to{transform:translateY(0)}}
.glass .wave{animation:slosh 5s ease-in-out infinite}
.glass .bubbles circle{animation:rise 3s linear infinite;transform-box:fill-box}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.85}100%{transform:translateY(-175px);opacity:0}}
@keyframes slosh{0%,100%{transform:translateX(0)}50%{transform:translateX(-30px)}}
@media (prefers-reduced-motion:reduce){.glass.pour .liquid,.glass .wave,.glass .bubbles circle{animation:none}}
.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.run-card{all:unset;cursor:pointer;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.run-card:hover{border-color:var(--accent)}
.run-card:focus-visible{outline:2px solid var(--accent)}
.run-card .pct{font-family:var(--f-display);font-stretch:70%;font-size:2.4rem;font-weight:800;line-height:1}
.run-card .meta{display:grid;gap:4px;min-width:0}
.run-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.run-hero .big{font-family:var(--f-display);font-stretch:66%;font-size:clamp(3.4rem,9vw,5.6rem);font-weight:800;line-height:.9;letter-spacing:-.02em}
@media (max-width:560px){.run-hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.run-hero .stats{text-align:left;width:100%}}
.scanbar{display:flex;gap:8px}
.scanbar input{font-family:var(--f-mono);font-size:1.1rem;letter-spacing:.04em}
.binchips{display:flex;flex-wrap:wrap;gap:6px}
.binchip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2);border-radius:6px;padding:3px 4px 3px 8px}
.binchip button{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;color:var(--muted);border-radius:4px}
.binchip button:hover{background:var(--bad-soft);color:var(--bad)}
.notice{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}

/* vessels */
.tanks{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.tank{all:unset;cursor:pointer;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;min-height:128px}
.tank:hover{border-color:var(--accent)}
.tank:focus-visible{outline:2px solid var(--accent)}
.tank .fill{position:relative;border:1.5px solid var(--glass-line);border-radius:6px 6px 8px 8px;overflow:hidden;background:var(--surface-2)}
.tank .fill i{position:absolute;left:0;right:0;bottom:0}
.tank .code{font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:1.3rem;line-height:1}
.tank .info{display:grid;gap:3px;align-content:start;min-width:0;font-size:.82rem}

/* trace */
.trace{display:grid;gap:0;position:relative}
.trace .stage{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;padding-bottom:18px;position:relative}
.trace .stage::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.trace .stage:last-child::before{display:none}
.trace .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;background:var(--accent-soft);color:var(--accent);font-weight:500;z-index:1}
.trace .body{display:grid;gap:6px;min-width:0;padding-top:3px}
.trace .items{display:flex;flex-wrap:wrap;gap:6px}
.tag{all:unset;cursor:pointer;font-size:.84rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.tag:hover{border-color:var(--accent)}
span.tag{cursor:default}
span.tag:hover{border-color:var(--line)}

/* docs */
.doc{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:clamp(18px,4vw,40px);display:grid;gap:22px;max-width:860px;width:100%;box-shadow:0 1px 0 var(--line),0 12px 30px -20px rgba(20,10,20,.35)}
.doc .dh{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start}
.doc .dtitle{font-family:var(--f-display);font-stretch:66%;font-weight:900;font-size:1.9rem;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.doc .parties{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.doc .parties div{display:grid;gap:2px;min-width:0}
.doc .total{display:flex;justify-content:flex-end;gap:28px;font-weight:600}
.doc .fine{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:22px;padding-top:12px}
.sigs div{border-top:1px solid var(--ink);padding-top:6px;font-size:.78rem;color:var(--muted)}
.lines{display:grid;gap:10px}
.line-row{display:grid;grid-template-columns:150px minmax(0,1.6fr) 100px 90px 110px 38px;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
@media (max-width:820px){.line-row{grid-template-columns:repeat(2,minmax(0,1fr))}.line-row .wide{grid-column:1/-1}}

/* sheet + toast */
[hidden]{display:none!important}
#sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px}
.sheet-back{position:absolute;inset:0;background:rgba(15,8,14,.48)}
.sheet-card{position:relative;background:var(--surface);border-radius:14px;width:min(620px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;display:grid;gap:16px;border:1px solid var(--line)}
.sheet-card header{display:flex;justify-content:space-between;align-items:center;gap:10px}

function calcItem(it,gal){

  else if(it.unit==='pct_vol'){amt=gal*it.rate/100;unit='gal';how=`${fmt(gal,1)} gal × ${it.rate}% = ${fmt(amt,1)} gal`}
  else if(it.unit==='g_gal'){amt=gal*it.rate;how=`${fmt(gal,1)} gal × ${it.rate} g/gal = ${fmt(amt,1)} g`}
  else{amt=gal/1000*it.rate*453.592;how=`${fmt(gal,1)} gal × ${it.rate} lb/1000 gal = ${fmt(gal/1000*it.rate,2)} lb`}
  return{additive:it.additive,rate:it.rate,unit:it.unit,amount:amt,amountUnit:unit,how};
}

  if(metric==='volume'){const pl=r.plannedGal||r.chargeGal||0;return{pct:pl?gal/pl:0,label:`${fmt(gal)} of ${fmt(pl)} gal`,sub:r.source==='still'?`Collected from ${fmt(r.chargeGal)} gal charged`:'Batch size set when the run started'}}

    return{pct:plan?n/plan:0,label:plan?`${n} of ${plan} bins · ${plan-n} left`:'No bins planned yet',sub:`${rateTxt}${rt&&r.start?fmt(n/(((r.end?new Date(r.end):new Date())-new Date(r.start))/3.6e6),1)+' bins/hr · ':''}${r.plannedBins?'Planned for this run':'Set from the weigh tag when the first bin loads'}`}}
  if(metric==='gallons'||(belt&&metric==='cycle')){const aj=r.source==='bins'?tagAdjust(runTokens(r)):{y:1,used:[]},t=tons*m.galPerTon*aj.y;return{pct:t?gal/t:0,label:`${fmt(gal)} of ${fmt(t)} gal`,sub:`${rateTxt}Expected ${m.galPerTon} gal/ton × ${fmt(tons,2)} tons${aj.used.length?' · '+adjText(aj):''}`}}
  if(metric==='cycle'){
    if(!r.start)return{pct:0,label:'Program not started',sub:`${m.cycleMin}-minute press program`};

  }

function merge3(base,local,remote){
  const out={...remote},S=JSON.stringify;
  for(const k of new Set([...Object.keys(local||{}),...Object.keys(remote||{})])){
    const b=base?base[k]:undefined,l=local[k],r=remote[k];
    if(S(l)===S(b)){out[k]=r;continue}
    if(S(r)===S(b)||r===undefined){out[k]=l;continue}
    if(Array.isArray(l)&&Array.isArray(r)&&l.every(x=>x&&x.id!=null)&&r.every(x=>x&&x.id!=null)){
      const bm=new Map((Array.isArray(b)?b:[]).map(x=>[x.id,S(x)])),lm=new Map(l.map(x=>[x.id,x])),res=[],seen=new Set();
      r.forEach(x=>{seen.add(x.id);const lx=lm.get(x.id);
        if(lx)res.push(bm.get(x.id)!==S(lx)?lx:x);          // both have it: local wins only if local changed it
        else if(!bm.has(x.id)||bm.get(x.id)!==S(x))res.push(x)}); // added remotely, or deleted here but changed there
      l.forEach(x=>{if(!seen.has(x.id)&&!bm.has(x.id))res.push(x)}); // added here

    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));return{blob,w,h}}
  finally{URL.revokeObjectURL(url)}
}

/* ---------- planning ---------- */
const at=(date,hm)=>new Date(`${date}T${hm||'07:00'}:00`);
const fT=d=>d?d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'—';
const fDur=h=>{const m=Math.round(h*60);return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`};
function machineStats(m){
  const runs=db.runs.filter(r=>r.machineId===m.id&&r.status==='done'&&r.start&&r.end&&runTons(r)>0);
  const hpt=runs.map(r=>((new Date(r.end)-new Date(r.start))/3.6e6)/runTons(r));
  const br=runs.filter(r=>r.source==='bins'),tons=br.reduce((a,r)=>a+runTons(r),0),gal=br.reduce((a,r)=>a+runGal(r),0);
  const pg=br.reduce((a,r)=>a+r.fractions.filter(f=>/Press/.test(f.type)).reduce((x,f)=>x+f.gal,0),0);
  return{n:hpt.length,hpt:hpt.length?hpt.reduce((a,b)=>a+b)/hpt.length:null,yn:br.length,gpt:tons?gal/tons:null,pressShare:gal?pg/gal:null};
}
function setHours(m,tons){
  if(m.type==='press'&&m.cycleMin&&m.capTons)return Math.ceil(tons/m.capTons)*(m.cycleMin+20)/60;
  return tons/(m.ratedTph||(m.type==='destemmer'?8:5));
}
function estHours(m,tons){
  const st=machineStats(m),set=setHours(m,tons);
  if(!st.n)return{h:set,src:m.type==='press'&&m.cycleMin&&m.capTons?`Set rate: ${Math.ceil(tons/m.capTons)} load${Math.ceil(tons/m.capTons)>1?'s':''} × ${m.cycleMin}+20 min`:`Set rate: ${fmt(m.ratedTph||(m.type==='destemmer'?8:5),1)} t/hr`};
  const w=Math.min(1,st.n/3),h=w*tons*st.hpt+(1-w)*set;
  return{h,src:st.n>=3?`Learned from ${st.n} runs`:`Set rate blended with ${st.n} past run${st.n>1?'s':''}`};
}
function estYield(m){const st=machineStats(m),w=Math.min(1,st.yn/3);return st.gpt?w*st.gpt+(1-w)*m.galPerTon:m.galPerTon}
function avgBinLbs(){const b=db.bins;return b.length?b.reduce((a,x)=>a+x.lbs,0)/b.length:1000}
function jobRun(j){return j.wtId?db.runs.find(r=>r.binIds.some(b=>BIN(b)?.wtId===j.wtId)):null}
let planCache=null;
function jobRun(j){
  if(j.kind==='pressoff')return db.runs.find(r=>r.jobId===j.id||(r.source==='vessel'&&r.sourceVesselId===j.vesselId&&r.date===j.date));
  return db.runs.find(r=>r.jobId===j.id)||(j.wtId?db.runs.find(r=>r.binIds.some(b=>BIN(b)?.wtId===j.wtId)):null);
}
const jobName=j=>j.kind==='pressoff'?`press-off of ${j.vesselId}`:j.kind==='transfer'?`transfer from ${j.vesselId}`:j.kind==='package'?`packaging from ${j.vesselId}`:`${BK(j.blockId)?.varietal||'fruit'} pick`;
const isBarrel=v=>v&&v.kind==='Barrel';
function planDay(target){
  if(planCache&&planCache[target])return planCache[target];
  planCache=planCache||{};
  const S=db.settings,T=today(),now=new Date(),cleanMs=(S.cleanMin??45)*60000;
  const days=[];if(target<T)days.push(target);else for(let d=T;d<=target;d=iso(new Date(dt(d).getTime()+864e5)))days.push(d);
  const pool=db.vessels.filter(v=>!isBarrel(v)).map(v=>!v.lotId&&v.gal<=0
    ?{v,freeAt:v.needsClean?new Date(Math.max(now,at(T,S.dayStart))+cleanMs):new Date(0),dirty:!!v.needsClean,why:v.needsClean?'empty now, cleaning open':''}
    :{v,freeAt:null});
  db.workOrders.filter(w=>w.status==='open'&&w.type==='rack'&&w.toVesselId).forEach(w=>{const q=pool.find(x=>x.v.id===w.toVesselId);if(q){q.freeAt=null;q.reservedBy=w.no}});
  const free=(vid,when,why)=>{const q=pool.find(x=>x.v.id===vid);if(q&&q.freeAt===null){q.freeAt=new Date(when.getTime()+cleanMs);q.dirty=true;q.emptyAt=when;q.why=why}};
  db.workOrders.filter(w=>w.status==='open'&&w.emptiesSource&&w.vesselIds[0]).forEach(w=>free(w.vesselIds[0],at(w.due<T?T:w.due,w.dueTime||'12:00'),`${w.no} ${WO_TYPES[w.type].toLowerCase()} ${fDate(w.due)}`));
  db.runs.filter(r=>r.status!=='done'&&r.source==='vessel'&&r.start).forEach(r=>{const e=estHours(M(r.machineId),runTons(r));free(r.sourceVesselId,new Date(new Date(r.start).getTime()+e.h*3.6e6),`${r.no} press-out`)});
  days.forEach(d=>{planCache[d]=planOne(d,pool,free)});
  return planCache[target];
}
function planOne(date,pool,free){
  const S=db.settings,isToday=date===today(),now=new Date(),dayStart=at(date,S.dayStart);
  const jobs=db.schedule.filter(j=>j.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const items=[],cursor={},tanks=[],adds=[],cleanings=[];let juiceTotes=0,harvest=0;
  if(isToday)db.runs.filter(r=>r.status!=='done'&&r.start&&!jobs.some(j=>jobRun(j)?.id===r.id)).forEach(r=>{
    const m=M(r.machineId),e=estHours(m,runTons(r)),st=new Date(r.start),end=new Date(st.getTime()+e.h*3.6e6);
    items.push({block:true,run:r,machine:m,start:st,end,label:`${r.no} · ${r.lotCode}`});cursor[m.id]=end;

const WO_TONE={addition:'accent',clean:'',rack:'warn',barreldown:'warn',top:'',other:''};
const woFor=key=>db.workOrders.find(w=>w.key===key);
function newWO(o){const w={id:uid('wo'),no:'WO-'+nextNo('wo'),status:'open',vesselIds:[],items:[],assigneeId:db.settings.woRouting?.[o.type]||'',notes:'',createdAt:new Date().toISOString(),createdBy:db.users?me().id:'',...o};db.workOrders.push(w);return w}

function addHours(h){const d=new Date(Date.now()+h*3.6e6);return{due:iso(d),dueTime:d.toTimeString().slice(0,5)}}
function pressAdditions(v,lot,runNo){
  if(!['juice','must'].includes(lot.state))return 0;let n=0;
  db.protocols.filter(r=>r.enabled&&r.trigger==='press'&&ruleFits(r,lot)).forEach(r=>{
    const key=`press:${r.id}:${v.id}:${lot.id}`,ex=woFor(key),items=r.items.map(it=>calcItem(it,v.gal));
    if(ex){if(ex.status==='open'){ex.items=items;ex.gal=v.gal;ex.source=`Auto: ${runNo}, ${fmt(v.gal)} gal in ${v.code}`}}
    else{newWO({type:'addition',title:r.name,vesselIds:[v.id],lotId:lot.id,gal:v.gal,items,key,source:`Auto: ${runNo}, ${fmt(v.gal)} gal in ${v.code}`,...addHours(r.offsetH)});n++}
  });return n;
}
function brixAdditions(lot,brix,src){
  let n=0;db.protocols.filter(r=>r.enabled&&(r.trigger==='third'||r.trigger==='dry')&&ruleFits(r,lot)).forEach(r=>{
    const th=r.trigger==='third'?lot.brix0*2/3:0;if(brix>th)return;
    const key=`${r.trigger}:${r.id}:${lot.id}`;if(woFor(key))return;
    const g=lotGal(lot.id);newWO({type:'addition',title:r.name,vesselIds:lotVessels(lot.id).map(v=>v.id),lotId:lot.id,gal:g,items:r.items.map(it=>calcItem(it,g)),key,source:src,due:today(),dueTime:''});n++});
  return n;
}
function emptyVessel(v,why){

}

   <div class="pb"><p class="${v.sensor?'':'muted'}">${v.sensor?`Sensor <b class="mono">${esc(v.sensor)}</b> is assigned to ${v.code}. Live readings will post to this tank's chart once the sensor feed is connected.`:'No sensor assigned. Temperatures come from readings logged by hand until a sensor feed is connected.'}</p></div></div>`}`;

function lineage(lot,seen=new Set()){
  if(!lot||seen.has(lot.id))return{runs:[],wts:[]};seen.add(lot.id);
  const runs=db.runs.filter(r=>r.fractions.some(f=>f.lotId===lot.id));
  let wts=[];runs.forEach(r=>{r.binIds.forEach(b=>{const w=BIN(b)?.wtId;if(w&&!wts.includes(w))wts.push(w)});
    if(r.source==='vessel'&&r.sourceLotId&&r.sourceLotId!==lot.id){const up=lineage(L(r.sourceLotId),seen);up.wts.forEach(w=>!wts.includes(w)&&wts.push(w));up.runs.forEach(x=>!runs.includes(x)&&runs.unshift(x))}});
  if(lot.parentId){const up=lineage(L(lot.parentId),seen);up.wts.forEach(w=>!wts.includes(w)&&wts.push(w));up.runs.forEach(x=>!runs.includes(x)&&runs.unshift(x))}
  return{runs,wts};
}

  const bt=db.bottlings.filter(b=>b.lotId===l.id);
  const skuSet=bt.map(b=>b.sku);
  const ships=db.sos.filter(s=>s.status==='shipped'&&s.lines.some(x=>x.lotId===l.id||(x.type==='cased'&&skuSet.includes(x.sku))));
  const bond=bondOf(l);
  return `${head(esc(l.code),`${l.vintage} ${esc(l.varietal)} · ${esc(ownerName(l.owner))}`,`<button class="btn" data-act="labResults" data-id="${l.id}">Record lab results</button>`,crumb('Lots','cellar','lots'))}
  <div style="display:flex;gap:8px;flex-wrap:wrap">${stateChip(l.state,l)}${chip(bondLabel(bond),bond==='OURS'?'':'accent')}${chip(KINDS[lotKind(l)].name)}${l.abv?chip(taxLabel(l),'accent'):''}</div>
  <div class="stats"><div><span class="label">On hand</span><b>${fmt(lotGal(l.id),1)}</b><span class="small muted">gal</span></div><div><span class="label">Fruit</span><b>${fmt(l.tons,2)}</b><span class="small muted">tons</span></div>

  <section><div class="sec-head"><h2>Tax class</h2><button class="btn sm" data-act="taxFromLot" data-id="${l.id}">Try changes in the tax check</button></div><div class="card">${(()=>{const inp=lotInput(l);if(!l.abv){const pa=projAbv(l);if(!pa)return'<p class="muted">Not finished yet. The class is worked out when fermentation is marked complete.</p>';inp.abv=pa;return `<p class="small muted" style="margin-bottom:8px">Not finished yet. Projected at about ${fmt(pa,1)}% alcohol from the starting gravity.</p>`+taxCard(classify(inp),altOf(inp)||{})}return taxCard(classify(inp),altOf(inp)||{})})()}</div></section>

  ${(()=>{const fq=[...wts.map(w=>'wt:'+w),...runs.map(r=>'run:'+r.id)].flatMap(qualityOf);return fq.length?`<section><h2>How the fruit came in and pressed</h2><div class="wos">${fq.map(q=>qCard(q).replace('<div class="top">',`<div class="top"><span class="mono small">${esc(targetLabel(q.target))}</span>`)).join('')}</div></section>`:''})()}
  ${qualityBlock('lot:'+l.id,['cellar'],'Tasting notes')}
  <section><h2>Photos</h2>${photoStrip('lot:'+l.id,{also:[...wts.map(w=>'wt:'+w),...runs.map(r=>'run:'+r.id),...lotVessels(l.id).map(v=>'vessel:'+v.id)]})}</section>
  <section><h2>Bin to bottle</h2><div class="card"><div class="trace">
   <div class="stage"><span class="n">1</span><div class="body"><span class="label">${term('grower')}</span><div class="items">${l.blocks.map(b=>{const bk=BK(b);return bk?`<button class="tag" ${go('party',bk.growerId)}>${esc(P(bk.growerId).name)} · ${esc(bk.name)}</button>`:''}).join('')}</div></div></div>
   <div class="stage"><span class="n">2</span><div class="body"><span class="label">Received · ${bins} bins</span>${wts.length?`<div class="items">${wts.map(w=>{const x=W(w);return `<button class="tag" ${go('wt',w)}>${x.no} · ${fDate(x.date)} · ${fmt(wtTons(x),2)} t · ${fmt(x.brix,1)} Bx</button>`}).join('')}</div>`:`<span class="muted">${l.carried?'Carried in from opening inventory':'—'}</span>`}</div></div>
   <div class="stage"><span class="n">3</span><div class="body"><span class="label">Processed</span>${runs.length?`<div class="items">${runs.map(r=>`<button class="tag" ${go('run',r.id)}>${r.no} · ${esc(M(r.machineId).name)} · ${fDate(r.date)}</button>`).join('')}</div>`:'<span class="muted">—</span>'}</div></div>

   <div class="stage"><span class="n">6</span><div class="body"><span class="label">Packaging</span>${bt.length?`<div class="items">${bt.map(b=>`<span class="tag">${b.no} · ${fDate(b.date)} · ${fmt(b.cases)} ${fmtOf(b).unit} ${esc(b.sku)}</span>`).join('')}</div>`:'<span class="muted">Not packaged</span>'}</div></div>

/* orders */
const lineTypes=()=>[['bulk_juice','Bulk juice or wort'],['bulk_wine',`Bulk ${term('product')}`],['cased','Packaged goods'],['service','Custom crush service']];
const lineTypeName=t=>(lineTypes().find(x=>x[0]===t)||[0,t])[1];
const soTotal=s=>s.lines.reduce((a,l)=>a+(l.qty||0)*(l.price||0),0);
const poTotal=p=>p.lines.reduce((a,l)=>a+(l.qty||0)*(l.price||0),0);
function lineDesc(x){
  if(x.type==='cased'){const s=skus().find(k=>k.sku===x.sku);return s?`${s.sku} · ${s.label}, ${FORMATS[s.format].name}`:x.sku}
  if(x.type==='service')return x.desc;
  const l=L(x.lotId);return l?`${x.type==='bulk_juice'?(l.state==='fermenting'?'Fermenting juice':'Bulk juice'):'Bulk '+KINDS[lotKind(l)].name.toLowerCase()} · ${l.vintage} ${l.varietal}`:(x.desc||'Bulk');
}

  if(tab==='po')return `${head('Orders','Fruit and supply purchases, with tons received against each PO.',`<button class="btn" data-act="importPO">Import from photo or scan</button><button class="btn primary" data-act="newPO">New purchase order</button>`)}${tabs}
   <div class="panel scroll"><table class="t"><thead><tr><th>PO</th><th>Date</th><th>Vendor</th><th>Items</th><th class="r">Total</th><th>Status</th></tr></thead><tbody>
   ${[...db.pos].reverse().map(p=>`<tr class="link" ${go('po',p.id)}><td><b class="mono">${p.no}</b></td><td class="num">${fDate(p.date)}</td><td>${esc(P(p.partyId).name)}</td><td class="small">${p.lines.map(l=>esc(l.desc)).join('<br>')}</td><td class="r num">${money(poTotal(p))}</td><td>${chip(p.status,p.status==='received'?'ok':p.status==='open'?'warn':'')}</td></tr>`).join('')}</tbody></table></div>`;
  if(tab==='bol')return `${head('Orders','Bills of lading are created when an order ships.')}${tabs}
   ${db.bols.length?`<div class="panel scroll"><table class="t"><thead><tr><th>BOL</th><th>Date</th><th>Consignee</th><th>Carrier</th><th>Type</th><th>Order</th></tr></thead><tbody>
   ${[...db.bols].reverse().map(b=>`<tr class="link" ${go('bol',b.id)}><td><b class="mono">${b.no}</b></td><td class="num">${fDate(b.date)}</td><td>${esc(P(b.partyId).name)}</td><td>${esc(P(b.carrierId).name)}</td><td>${b.inbond?chip('In bond','accent'):chip('Taxpaid')}</td><td class="mono">${db.sos.find(s=>s.id===b.soId)?.no||'—'}</td></tr>`).join('')}</tbody></table></div>`:empty('No shipments yet.')}`;
  return `${head('Orders','Bulk juice, bulk cider, packaged goods and custom crush billing.',`<button class="btn primary" data-act="newSO">New sales order</button>`)}${tabs}
   <div class="panel scroll"><table class="t"><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Contains</th><th class="r">Gallons</th><th class="r">Total</th><th>Status</th></tr></thead><tbody>
   ${[...db.sos].reverse().map(s=>{const g=s.lines.filter(x=>x.type.startsWith('bulk')).reduce((a,x)=>a+(x.qty||0),0);return `<tr class="link" ${go('so',s.id)}><td><b class="mono">${s.no}</b></td><td class="num">${fDate(s.date)}</td><td>${esc(P(s.partyId).name)}</td><td>${[...new Set(s.lines.map(x=>x.type))].map(t=>chip(lineTypeName(t))).join(' ')}</td><td class="r num">${g?fmt(g):'—'}</td><td class="r num">${money(soTotal(s))}</td><td>${s.status==='shipped'?chip('Shipped','ok'):chip('Draft','warn')}</td></tr>`}).join('')}</tbody></table></div>`;
};
function partyBlock(label,p){
  return `<div><span class="label">${label}</span><b>${esc(p.name)}</b>${p.contact?`<span>${esc(p.contact)}</span>`:''}${p.address?`<span class="small muted">${esc(p.address)}</span>`:''}${p.email?`<span class="small">${esc(p.email)}</span>`:''}${p.bondNo?`<span class="small mono">Bond ${esc(p.bondNo)}</span>`:''}</div>`;
}
function soRows(s){
  return s.lines.map(x=>{const l=L(x.lotId),bulk=x.type.startsWith('bulk');
    return `<tr><td>${esc(lineDesc(x))}</td><td class="mono small">${l?esc(l.code):''}</td><td class="r num">${fmt(x.qty,x.unit==='gal'||x.unit==='cases'?0:2)} ${esc(x.unit)}</td>
    <td class="r num">${bulk&&l?fmt(brixOf(l),1):''}</td><td class="r num">${bulk&&l?fmt(l.pH,2):''}</td><td class="r num">${bulk&&l?fmt(l.TA,1):''}</td><td class="r num">${bulk&&l&&l.abv?fmt(l.abv,1)+'%':''}</td>
    <td class="r num">${money(x.price)}</td><td class="r num">${money((x.qty||0)*(x.price||0))}</td></tr>`}).join('');
}
function soText(s){
  const p=P(s.partyId),w=P('OURS');
  const ls=s.lines.map(x=>{const l=L(x.lotId),bulk=x.type.startsWith('bulk');
    let t=`- ${lineDesc(x)}${l?` (lot ${l.code})`:''}: ${fmt(x.qty,x.unit==='gal'||x.unit==='cases'?0:2)} ${x.unit} @ ${money(x.price)} = ${money((x.qty||0)*(x.price||0))}`;
    if(bulk&&l)t+=`\n  Brix ${fmt(brixOf(l),1)} · pH ${fmt(l.pH,2)} · TA ${fmt(l.TA,1)} g/L${l.abv?` · Alc ${fmt(l.abv,1)}%`:''}`;return t}).join('\n');
  const gal=s.lines.filter(x=>x.type.startsWith('bulk')).reduce((a,x)=>a+(x.qty||0),0);
  return `Hi ${p.contact||p.name},\n\nSales order ${s.no} from ${w.name}, dated ${fDateY(s.date)}.\n\n${ls}\n\n${gal?`Total bulk volume: ${fmt(gal)} gal\n`:''}Order total: ${money(soTotal(s))}\n${s.notes?`\nNotes: ${s.notes}\n`:''}\nThank you,\n${w.name}\n${w.phone||''}`;
}

/* TTB */
const SIGN_A={opening:1,produced:1,received:1,bottled:-1,taxpaid:-1,inbond:-1,loss:-1,distill:-1};
const SIGN_B={bottled:1,b_taxpaid:-1,b_inbond:-1};
const KIND={distill:'Removed for distilling material',b_distill:'Removed to a distillery',sp_produced:'Spirits produced',sp_opening:'Opening inventory',opening:'Opening inventory',produced:'Produced by fermentation',received:'Received in bond',bottled:'Bottled',taxpaid:'Removed taxpaid (bulk)',inbond:'Transferred in bond (bulk)',loss:'Loss',b_taxpaid:'Removed taxpaid (bottled)',b_inbond:'Transferred in bond (bottled)'};
function monthList(){
  const out=[],min=db.ops.reduce((m,o)=>o.date<m?o.date:m,today()).slice(0,7);
  let [y,m]=min.split('-').map(Number);const [ty,tm]=today().slice(0,7).split('-').map(Number);
  while(y<ty||(y===ty&&m<=tm)){out.push(`${y}-${String(m).padStart(2,'0')}`);m++;if(m>12){m=1;y++}}
  return out.reverse();
}
function ttb(bond,month){
  const [y,m]=month.split('-').map(Number),start=month+'-01',end=`${m===12?y+1:y}-${String(m===12?1:m+1).padStart(2,'0')}-01`;
  const ops=db.ops.filter(o=>{const l=L(o.lotId);return l&&KINDS[lotKind(l)].family==='wine'&&bondOf(l)===bond});
  const z=()=>({a:0,b:0,c:0,d:0,e:0,f:0});
  const A={begin:z(),produced:z(),received:z(),bottled:z(),taxpaid:z(),inbond:z(),distill:z(),loss:z()},Bt={begin:z(),bottled:z(),b_taxpaid:z(),b_inbond:z()};
  const inP=[];
  ops.forEach(o=>{const c=taxClass(L(o.lotId))||'a';
    if(o.date<start){if(SIGN_A[o.kind])A.begin[c]+=SIGN_A[o.kind]*o.gal;if(SIGN_B[o.kind])Bt.begin[c]+=SIGN_B[o.kind]*o.gal}
    else if(o.date<end){inP.push(o);if(o.kind==='opening')A.begin[c]+=o.gal;else if(A[o.kind])A[o.kind][c]+=o.gal;if(Bt[o.kind])Bt[o.kind][c]+=o.gal}});
  const sum=(keys,src,c)=>keys.reduce((s,k)=>s+src[k][c],0);
  const res={A,Bt,ops:inP.sort((a,b)=>a.date.localeCompare(b.date))};
  ['a','b','c','d','e','f'].forEach(c=>{
    res['inA'+c]=sum(['begin','produced','received'],A,c);res['outA'+c]=sum(['bottled','taxpaid','inbond','distill','loss'],A,c);res['endA'+c]=res['inA'+c]-res['outA'+c];
    res['inB'+c]=sum(['begin','bottled'],Bt,c);res['endB'+c]=res['inB'+c]-sum(['b_taxpaid','b_inbond'],Bt,c);
  });
  return res;
}

  </tbody></table></div><p class="small muted">Lines with nothing to report this period are hidden. Hard cider and mead are reported as wine. Each lot's column comes from its tax class, worked out from its alcohol, carbonation and additions (open a lot to see why). Juice and fermenting cider stay off Section A until fermentation is marked complete.</p></section>

  </tbody></table></div></section>
  <section><h2>Activity this period</h2>${t.ops.length?`<div class="panel scroll"><table class="t"><thead><tr><th>Date</th><th>Activity</th><th>Lot</th><th class="r">Wine gal</th><th>Ref</th></tr></thead><tbody>

A.cancelRun=d=>{const r=R(d.id);if(!r||r.status==='done')return;

  sheet(`Cancel ${r.no}?`,[{name:'reason',label:'Why are you cancelling it?',placeholder:'Started on the wrong press, test run, entered twice…',full:true}],'Cancel run',x=>{
    [...r.fractions].forEach(f=>changeFraction(r,f,0,`Gallons taken back out when ${r.no} was cancelled`));
    r.binIds.forEach(id=>{const b=BIN(id);if(b){b.status='received';b.runId=null}});
    voidRec('run',{no:r.no,label:`${r.lotCode||'No lot'} · ${M(r.machineId).name} · ${binsN} bins${gal?` · ${fmt(gal)} gal`:''}`,reason:x.reason});

    else{ln.lotId=V(el.value)?.lotId||null}}
  if(draft===taxS&&p==='kind'){draft.base=KINDS[el.value].base}
  if(p==='partyId'&&draft.no&&draft.no.startsWith('PO'))draft.lines.forEach(l=>{if(l.blockId&&BK(l.blockId)?.growerId!==el.value)l.blockId=''});
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)cancelSheet();if(e.key==='Enter'&&e.target.tagName==='INPUT'&&((e.target.dataset&&e.target.dataset.jf)||e.target.id==='bn_q')){e.preventDefault();e.target.blur()}});

/* live glass for timed runs */
setInterval(()=>{
  document.querySelectorAll('[data-live]').forEach(el=>{
    const r=R(el.dataset.live);const mm=r&&M(r.machineId);if(!r||r.status!=='pressing'||(runMetric(r)!=='cycle'&&mm.type!=='belt'))return;
    const pr=runProgress(r);el.innerHTML=glass(pr.pct,runColor(r),+el.dataset.size,false);
    document.querySelectorAll(`[data-livepct="${r.id}"]`).forEach(x=>x.textContent=Math.round(pr.pct*100)+'%');
    document.querySelectorAll(`[data-livelabel="${r.id}"]`).forEach(x=>x.textContent=pr.label);
    document.querySelectorAll(`[data-livesub="${r.id}"]`).forEach(x=>x.textContent=pr.sub);
  });
},10000);

if(CLOUD)cloudBoot();
else{load();
if((view.page==='soedit'||view.page==='poedit')&&!draft)view={page:'today'};
render();}
</script>
